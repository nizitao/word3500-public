<!DOCTYPE html>

<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单词测试 - 高考英语词汇3500</title>
  <script data-cfasync="false">
    (function(){
      try {
        var s = JSON.parse(localStorage.getItem('word3500_auth'));
        // 只要还有 access_token 或 refresh_token 就放行：access_token 过期时
        // 由 js/auth.js 的 authFetch 自动换新。原实现一过期就跳登录页，
        // 使 7 天有效的 refresh_token 完全没机会生效。
        if (!s || (!s.access_token && !s.refresh_token)) {
          location.replace('/login?redirect=' + encodeURIComponent(location.pathname + location.search));
          return;
        }
        window.__auth_user = s.user || null;
      } catch(e) {
        location.replace('/login?redirect=' + encodeURIComponent(location.pathname + location.search));
      }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f6fed'/><g fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 8h12v15h-2a2 2 0 0 0-2 2H11a2 2 0 0 1-2-2z'/><path d='M9 25a2 2 0 0 1 2-2h12'/></g></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ---- 单词测试页专用 ---- */
    .quiz-container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }
    .quiz-card {
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      padding: 24px 26px 28px;
      border: 1px solid var(--border-light);
      margin-bottom: 16px;
    }
    .quiz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .quiz-header h2 {
      margin: 0;
      font-size: 20px;
      color: var(--text-primary);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .quiz-header h2 svg { width: 22px; height: 22px; flex-shrink: 0; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      border: 1px solid var(--border-default);
      background: var(--bg-btn-ghost);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, border-color .15s;
    }
    .back-btn:hover { background: var(--bg-hover); border-color: #b6c2d4; }
    .back-btn svg { width: 15px; height: 15px; }

    .quiz-meta {
      font-size: 13px;
      color: var(--text-tertiary);
      text-align: center;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--bg-btn-ghost);
      border-radius: 8px;
    }
    .quiz-meta strong { color: var(--text-primary); }

    .quiz-mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .quiz-mode-tabs button {
      flex: 1;
      border: 1px solid var(--border-default);
      background: var(--bg-btn-ghost);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .quiz-mode-tabs button svg { width: 15px; height: 15px; }
    .quiz-mode-tabs button.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .quiz-mode-tabs button.active svg { stroke: #fff; }

    .quiz-question {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 10px;
    }
    .quiz-word {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      /* 不可复制/选中，也不可作为拖拽源（拖进输入框 = 直接给答案） */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
    }
    .quiz-mean {
      text-align: center;
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .quiz-option {
      border: 1px solid var(--border-default);
      background: var(--bg-card);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 15px;
      color: var(--text-primary);
      cursor: pointer;
      text-align: left;
      transition: all .15s;
    }
    .quiz-option:hover { background: var(--bg-hover); border-color: var(--primary); }
    .quiz-option.correct { background: #d1fae5; border-color: #34d399; color: #065f46; }
    .quiz-option.wrong { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger); }
    .quiz-option:disabled { cursor: default; opacity: .85; }
    [data-theme="dark"] .quiz-option.correct { background: #064e3b; color: #6ee7b7; }
    .quiz-input-row {
      display: flex;
      gap: 8px;
    }
    .quiz-input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border-default);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: var(--bg-input);
      color: var(--text-primary);
      min-width: 0;
    }
    .quiz-input-row input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus-ring); }
    .quiz-input-row input.correct { border-color: #34d399; background: #ecfdf5; }
    .quiz-input-row input.wrong { border-color: var(--danger-border); background: var(--danger-bg); }
    [data-theme="dark"] .quiz-input-row input.correct { background: #064e3b; }
    .quiz-submit {
      border: none;
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .quiz-submit:hover { background: var(--primary-hover); }
    .quiz-sound {
      border: 1px solid var(--border-default);
      background: var(--bg-btn-ghost);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .15s;
    }
    .quiz-sound:hover { background: var(--bg-hover); }
    .quiz-sound svg { width: 17px; height: 17px; stroke: var(--primary); }
    .quiz-sound-row {
      text-align: center;
      margin-bottom: 14px;
    }
    .quiz-feedback {
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
      min-height: 20px;
    }
    .quiz-feedback.ok { color: #16a34a; }
    .quiz-feedback.bad { color: var(--danger); }
    .quiz-next-row { text-align: center; margin-top: 12px; }
    .quiz-next-row button {
      border: none;
      background: var(--primary);
      color: #fff;
      border-radius: 8px;
      padding: 8px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .quiz-next-row button:hover { background: var(--primary-hover); }
    /* 次要动作（取消自动跳转 / 查看统计）：不与主按钮抢视觉权重 */
    .quiz-next-row .quiz-ghost {
      display: inline-block;
      margin-left: 8px;
      padding: 8px 16px;
      border: 1px solid var(--border-default);
      background: transparent;
      color: var(--text-secondary);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      vertical-align: middle;
    }
    .quiz-next-row .quiz-ghost:hover { background: var(--bg-hover); border-color: #b6c2d4; }
    .quiz-next-row .quiz-ghost[disabled] { opacity: .5; cursor: default; }
    .quiz-result { text-align: center; padding: 14px 0; }
    .quiz-result .score { font-size: 34px; font-weight: 700; color: var(--primary); }
    .quiz-result .sub { font-size: 14px; color: var(--text-tertiary); margin-top: 6px; }

    .empty-tip {
      text-align: center;
      padding: 30px 0;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.8;
    }
    .empty-tip a {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 18px;
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
    }
    .empty-tip a:hover { background: var(--focus-ring); }

    /* 听写专用 */
    .dictate-hint { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 8px; }

    /* 单元背诵模式 */
    .unit-toggle-row { display: flex; align-items: center; }
    .unit-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .unit-toggle input { accent-color: var(--primary); width: 16px; height: 16px; }
    .unit-select-label { font-size: 12px; color: var(--text-muted); }
    .unit-progress {
      font-size: 12px;
      color: var(--text-tertiary);
      background: var(--bg-btn-ghost);
      border: 1px solid var(--border-lighter);
      border-radius: 8px;
      padding: 6px 10px;
    }
    .unit-progress .up-fill {
      display: inline-block;
      height: 6px;
      background: var(--primary);
      border-radius: 3px;
      margin-top: 4px;
      transition: width .3s ease;
    }

    /* 单词流（始终模糊，直到确认答案） */
    .word-stream-title { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .word-stream {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
      padding: 8px;
      background: var(--bg-btn-ghost);
      border: 1px solid var(--border-lighter);
      border-radius: 10px;
      /* 整块不可选中 / 不可拖拽：chip 里的单词是明文，拖出去就泄题 */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
    }
    .word-stream .ws-chip {
      font-size: 13px;
      padding: 3px 10px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      transition: all .2s ease;
      /* 不可复制/选中/拖拽 */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      /* 始终模糊：单词不可辨认，避免提前看到答案 */
      filter: blur(8px) saturate(0.2) contrast(0.6);
      opacity: .35;
      pointer-events: none;
    }
    .word-stream .ws-chip.current {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 700;
      /* 当前 chip 同样模糊，保留蓝色定位底色 */
      filter: blur(8px) saturate(0.2) contrast(0.6);
      opacity: .4;
    }
    /* 已掌握：标绿（同样模糊，保留绿底定位） */
    .word-stream .ws-chip.master {
      background: #d1fae5;
      border-color: #34d399;
      color: #065f46;
      font-weight: 600;
      filter: blur(8px) saturate(0.2) contrast(0.6);
      opacity: .4;
    }
    [data-theme="dark"] .word-stream .ws-chip.master {
      background: #064e3b;
      border-color: #10b981;
      color: #6ee7b7;
    }
    /* 中间大单词：拼写模式默认模糊（防照抄），确认答案（.reveal）后清晰。
       模糊必须按模式限定 —— 选择释义模式下单词本身就是题干，模糊会导致无法作答。
       模式由 js/quiz.js 写在 .quiz-card[data-mode] 上。 */
    .quiz-card[data-mode="spell"] .quiz-word {
      filter: blur(10px) saturate(0.2) contrast(0.6);
      opacity: .3;
      user-select: none;
      pointer-events: none;
      transition: filter .3s ease, opacity .3s ease;
    }
    .quiz-card[data-mode="spell"] .quiz-word.reveal {
      filter: none;
      opacity: 1;
      user-select: text;
      pointer-events: auto;
    }
    @media (max-width: 480px) {
      .quiz-card { padding: 20px 16px 24px; }
      .quiz-word { font-size: 24px; }
      .quiz-mode-tabs button { font-size: 12px; padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="quiz-container">
      <div class="quiz-card" id="quizCard" data-mode="spell">
        <div class="quiz-header">
          <h2>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="4"/><path d="M10.8 11 18 21l2-1.5-7.2-9.7"/><path d="m6.5 15 2.7 2.5L12 15"/></svg>
            单词测试
          </h2>
          <div class="header-actions">
            <span id="userBar" class="user-bar" style="display:none;"></span>
            <a href="/favorites" class="back-btn" id="backToLearnBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
              返回收藏夹
            </a>
          </div>
        </div>

        <div class="quiz-meta" id="quizMeta">单词测试</div>

        <!-- 单元背诵模式选择 -->
        <div id="unitPanel" style="display:none;margin-bottom:14px;">
          <div class="unit-toggle-row">
            <label class="unit-toggle">
              <input type="checkbox" id="unitModeCheck">
              <span>单元背诵模式（按单元顺序逐个背诵）</span>
            </label>
          </div>
          <div id="unitSelectWrap" style="display:none;margin-top:10px;">
            <div class="unit-select-label">选择背诵起始单元（与首页一致）</div>
            <div style="display:flex;gap:8px;margin-top:6px;">
              <select id="bookSelect" class="filter-select" style="flex:1;">
                <option value="">全部册</option>
              </select>
              <select id="unitSelect" class="filter-select" style="flex:1;"></select>
            </div>
            <div class="unit-progress" id="unitProgress" style="display:none;margin-top:10px;"></div>
          </div>
        </div>

        <div class="quiz-mode-tabs">
          <button id="modeSpell" class="active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="m6 16 6-12 6 12"/><path d="M8 12h8"/></svg>
            拼写测试
          </button>
          <button id="modeChoice">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 3 3 3-3"/><path d="M12 7h9"/><path d="m3 15 3 3 3-3"/><path d="M12 14h9"/><path d="m3 21 3 3 3-3"/><path d="M12 21h9"/></svg>
            选择释义
          </button>
          <button id="modeDictate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
            听写练习
          </button>
        </div>

        <div id="quizArea">
          <div class="empty-tip">加载中...</div>
        </div>

        <!-- 单词流（聚焦时模糊其他单词） -->
        <div id="wordStreamWrap" style="display:none;margin-top:16px;">
          <div class="word-stream-title">当前单元单词</div>
          <div class="word-stream" id="wordStream"></div>
        </div>
      </div>

      <footer>单词测试 · 进度保存在本机浏览器（localStorage）</footer>
    </div>
  </div>
  <script src="js/auth.js?v=20260815" data-cfasync="false"></script>
  <script src="/js/online.js?v=20261102" data-cfasync="false"></script>
  <script src="/js/nav.js?v=20261108b" data-cfasync="false"></script>
  <script src="js/quiz.js?v=20261114" data-cfasync="false"></script>
</body>
</html>
